<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Theme boot: runs before first paint so the page never flashes the
       wrong theme. Falls back to the OS setting when nothing is stored.
       The `js` class lets CSS hide reveal targets only when JS can show them. -->
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      var t = null;
      try { t = localStorage.getItem('site-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      d.setAttribute('data-theme', t);
    })();
  </script>

  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">

  <meta name="description" content="Blog by Filipe Thomaz — thoughts on making things across disciplines.">
